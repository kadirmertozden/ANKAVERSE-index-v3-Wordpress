name: Content sync

# Pulls WordPress content, translates what is new, and commits the result.
#
# This runs here rather than in the Coolify build because Coolify builds in a
# throwaway container: a translation cache written there is discarded, so every
# deploy would retranslate all 70 posts and exhaust the DeepL quota within a
# few pushes. Committing the translations makes each item cost exactly one
# translation for its lifetime, keeps the text stable at a given URL, and lets
# a bad translation be corrected by editing a file.
#
# Pushing to main triggers the Coolify deploy.

on:
  schedule:
    # Hourly. A new WordPress post is live within the hour; use the manual
    # trigger below to publish one immediately.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      post_locales:
        description: 'Locales to translate blog posts into (comma separated)'
        required: false
        default: 'en'
      force_locales:
        description: 'Retranslate every UI string, overwriting manual edits'
        type: boolean
        required: false
        default: false

# One run at a time: two concurrent runs would race on the same commit.
concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch WordPress content
        env:
          WORDPRESS_API_URL: ${{ vars.WORDPRESS_API_URL }}
        run: node tools/fetch-content.js

      - name: Translate UI strings
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          node tools/translate-locales.js \
            ${{ inputs.force_locales && '--force' || '' }}

      - name: Translate content
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          CONTENT_LOCALES: ${{ inputs.post_locales || 'en' }}
        run: node tools/translate-content.js

      - name: Verify the site still builds
        run: npm run build

      - name: Commit and push
        run: |
          if git diff --quiet -- src/content src/locales src/i18n/published.js; then
            echo "No content changes."
            exit 0
          fi

          git config user.name  "ankaverse-content-bot"
          git config user.email "info@ankaverse.com.tr"
          git add src/content src/locales src/i18n/published.js
          git commit -m "Sync WordPress content and translations

          Generated by .github/workflows/content-sync.yml."

          # Rebase before pushing: a human commit may have landed since checkout.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
