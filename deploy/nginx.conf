# nginx configuration for the Coolify static-site deployment.
#
# Paste into Coolify -> application -> Configuration -> Advanced -> custom
# nginx configuration.
#
# Two settings must also be changed in the Coolify UI; they cannot be done here:
#   - Is it a static site?: on, Publish Directory: /dist
#   - Domains Direction: "Redirect to non-www" (both hosts currently answer 200,
#     which splits the site's ranking across two duplicate origins)

server {
    listen 80;
    server_name _;

    # Confirmed by inspecting the running container: Coolify's static image
    # publishes into the stock nginx document root, not /app.
    root /usr/share/nginx/html;
    index index.html;

    # Redirects must stay relative. nginx terminates plain HTTP behind
    # Coolify's TLS proxy, so an absolute Location it builds itself would carry
    # scheme http:// and downgrade every redirect off HTTPS.
    absolute_redirect off;

    # ---- Permanent redirects -------------------------------------------
    # www -> non-www. Coolify's own domain redirect answers 302, which does not
    # consolidate ranking; with both hostnames routed here it becomes a 301 we
    # control. Written as an absolute URL on purpose -- absolute_redirect is off
    # below, and a relative Location cannot change host.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # The corporate page moved from /giris to the site root. These are 301s,
    # not rewrites: the old URLs must hand their ranking to /.
    location = /giris      { return 301 /; }
    location = /giris.html { return 301 /; }
    location = /kurumsal   { return 301 /; }

    # ---- Assets ----------------------------------------------------------
    # Filenames are content-hashed, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ---- Prerendered pages ------------------------------------------------
    # Every route is a real directory containing index.html.
    #
    # `$uri/` is deliberately absent from try_files: it makes nginx answer
    # /hakkimizda with a 301 to /hakkimizda/, and the canonical URLs carry no
    # trailing slash. Every page would then redirect to a URL whose canonical
    # points back at the one that redirected -- a conflict Google resolves by
    # trusting neither. Serving $uri/index.html directly returns 200 at the
    # canonical URL.
    #
    # There is also no fallback to /index.html: answering an unknown URL with
    # the home page and a 200 is the soft 404 this rebuild set out to remove.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/index.html =404;
    }

    # ---- Real 404 ---------------------------------------------------------
    # Named location without `=`, so the response keeps its 404 status rather
    # than being rewritten to 200.
    error_page 404 @notfound;

    location @notfound {
        add_header Cache-Control "no-store";
        try_files /404/index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xhtml+xml image/svg+xml;
    gzip_min_length 1024;
}
