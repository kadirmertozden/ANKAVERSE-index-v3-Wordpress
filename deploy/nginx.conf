# nginx configuration for the Coolify static-site deployment.
#
# Paste this into Coolify -> the application -> Configuration -> Advanced ->
# custom nginx configuration, after enabling "Is it a static site?" and setting
# Publish Directory to /dist.
#
# Two settings must also change in the Coolify UI itself; they cannot be done
# from here:
#   - Domains Direction: "Redirect to non-www" (both hosts currently answer
#     200, which splits the site's ranking across two duplicate origins)
#   - Is it a static site?: on, Publish Directory: /dist

server {
    listen 80;
    server_name _;
    root /app;
    index index.html;

    # ---- Permanent redirects -------------------------------------------
    # The corporate page moved from /giris to the site root. These are 301s,
    # not rewrites: the old URLs must hand their accumulated ranking to /.
    location = /giris        { return 301 /; }
    location = /giris.html   { return 301 /; }
    location = /kurumsal     { return 301 /; }

    # ---- Static assets --------------------------------------------------
    # Hashed filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ---- Prerendered pages ----------------------------------------------
    # Every route is a real directory containing index.html. There is
    # deliberately no SPA fallback to /index.html: serving the home page with
    # a 200 for an unknown URL is the soft 404 this rebuild set out to remove.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/xhtml+xml image/svg+xml;
    gzip_min_length 1024;
}
