<!doctype html>
<html lang="tr">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			The page title lives in the Seo component, not here: keeping a copy
			in this template shipped two of them on every page. The lang
			attribute above is a placeholder that Seo overwrites per locale.
		-->
		<link rel="preconnect" href="https://wordpress.ankaverse.com.tr" crossorigin />
		<!--
			Consent Mode v2 defaults. This block has to run before AdSense and
			gtag.js below it, not after: a default set late leaves a window in
			which the tags have already stored and sent for a visitor who never
			agreed, which is the whole thing the banner exists to prevent.

			Denied everywhere rather than by region. GDPR covers the European
			visitors this site is written for and KVKK covers the Turkish ones,
			so there is no meaningful population left to treat differently.

			A previous answer is read back synchronously here so a returning
			visitor who accepted is not measured a page late. src/lib/consent.js
			holds the same logic for the banner; the duplication is deliberate,
			because this must run before any module loads.
		-->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}

			gtag('consent', 'default', {
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				analytics_storage: 'denied',
				wait_for_update: 500
			});

			try {
				if (localStorage.getItem('ankaverse:consent') === 'granted') {
					gtag('consent', 'update', {
						ad_storage: 'granted',
						ad_user_data: 'granted',
						ad_personalization: 'granted',
						analytics_storage: 'granted'
					});
				}
			} catch (e) {
				/* Private browsing denies storage access; the default stands. */
			}
		</script>
		<!--
			Google Tag Manager. Google's instructions say to paste this as high in
			the head as possible; here it goes below the consent defaults instead.
			Above them it would load, and could fire tags, before anything had
			told it that storage is denied until the visitor agrees.

			GTM shares the dataLayer declared above, so it inherits that default.
			Do not add a GA4 tag inside GTM: G-G242C7TQGR is already configured
			through gtag.js below, and configuring it in both counts every visit
			twice.
		-->
		<!-- Google Tag Manager -->
		<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
		new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
		j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
		'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
		})(window,document,'script','dataLayer','GTM-WQJRH2G3');</script>
		<!-- End Google Tag Manager -->
		<!-- Google AdSense -->
		<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8018604164128885" crossorigin="anonymous"></script>
		<!--
			Google tag. One gtag.js serves both properties: the library takes a
			config per property, so loading it again for the second one would only
			add a request and more render-blocking script to every page.

			AW- is Ads conversion tracking. G- is GA4, added 2026-08-05 -- until
			then the site had no traffic measurement at all, so an SEO rebuild had
			no way to show whether it worked.
		-->
		<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18324882869"></script>
		<script>
			gtag('js', new Date());
			gtag('config', 'AW-18324882869');
			gtag('config', 'G-G242C7TQGR');
		</script>
	</head>
	<body>
		<!-- Google Tag Manager (noscript) -->
		<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WQJRH2G3"
		height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
		<!-- End Google Tag Manager (noscript) -->
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
